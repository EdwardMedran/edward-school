spring.server.port=8082

spring.application.name=Edward School
server.servlet.context-path=/edward-school

#ProstgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/edward_school_db
spring.datasource.username=edward
spring.datasource.password=edward.school

#Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always